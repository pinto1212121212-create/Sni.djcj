  <!-- Rate Limit -->
  <script>
  window.__rateLimit = {
    _key: 'rl_' + location.pathname,
    _max: 5,
    _window: 3600000,
    check(){
      const d = this._load();
      if(d.blockedUntil && Date.now() < d.blockedUntil){
        const m = Math.ceil((d.blockedUntil - Date.now())/60000);
        throw new Error('חסום למשך ' + m + ' דקות');
      }
      return true;
    },
    fail(){const d=this._load(); d.fails=(d.fails||0)+1; if(d.fails>=this._max){d.blockedUntil=Date.now()+this._window; d.fails=0;} this._save(d); return this._max-d.fails;},
    success(){this._save({fails:0, blockedUntil:0});},
    _load(){try{return JSON.parse(localStorage.getItem(this._key)||'{"fails":0}');}catch(e){return {fails:0};}},
    _save(d){try{localStorage.setItem(this._key, JSON.stringify(d));}catch(e){}}
  };
  </script>
  <!-- Audit Log -->
  <script>
  (function(){
    const KEY = 'audit_' + location.pathname;
    window.__audit = function(ev, data){
      try{
        const log = JSON.parse(localStorage.getItem(KEY)||'[]');
        log.push({t: Date.now(), e: ev, d: data||null});
        while(log.length > 500) log.shift();
        localStorage.setItem(KEY, JSON.stringify(log));
      }catch(e){}
    };
    window.__audit('page_loaded');
  })();
  </script>
  <!-- Device Fingerprint -->
  <script>
  window.__fingerprint = async function(){
    const data = navigator.userAgent + '|' + navigator.language + '|' + screen.width + 'x' + screen.height + '|' + (navigator.hardwareConcurrency||'') + '|' + new Date().getTimezoneOffset();
    const buf = new TextEncoder().encode(data);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0,16);
  };
  </script>
  <!-- Encrypted localStorage -->
  <script>
  window.__encLS = (function(){
    let _key = null;
    async function deriveKey(pw){
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2', salt: enc.encode('armor-salt-v1'), iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    }
    return {
      init: async function(pw){_key = await deriveKey(pw);},
      set: async function(k, v){
        if(!_key) throw new Error('Not initialized');
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _key, new TextEncoder().encode(v));
        const combined = new Uint8Array(iv.length + ct.byteLength);
        combined.set(iv);
        combined.set(new Uint8Array(ct), iv.length);
        localStorage.setItem(k, btoa(String.fromCharCode(...combined)));
      },
      get: async function(k){
        if(!_key) throw new Error('Not initialized');
        const stored = localStorage.getItem(k);
        if(!stored) return null;
        const data = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
        const iv = data.slice(0, 12);
        const ct = data.slice(12);
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, _key, ct);
        return new TextDecoder().decode(pt);
      }
    };
  })();
  </script>
  <!-- Auto-clear clipboard -->
  <script>
  window.__safeCopy = function(text, clearAfterMs){
    navigator.clipboard.writeText(text).then(() => {
      setTimeout(() => {navigator.clipboard.writeText(' ').catch(()=>{});}, clearAfterMs || 30000);
    });
  };
  </script>
  <!-- Session Timeout -->
  <script>
  (function(){
    const TIMEOUT = 1800000; // 30 min
    let lastActivity = Date.now();
    ['click','keydown','scroll','mousemove','touchstart'].forEach(ev => document.addEventListener(ev, () => {lastActivity = Date.now();}, {passive:true}));
    setInterval(() => {
      if(Date.now() - lastActivity > TIMEOUT){
        if(window.__audit) window.__audit('session_timeout');
        alert('⏰ פג תוקף הסשן בגלל חוסר פעילות. הדף יטען מחדש.');
        sessionStorage.clear();
        location.reload();
      }
    }, 30000);
  })();
  </script>

  <script>
  (function(){
    const FB_API = 'AIzaSyCsh6qM-WgbWn1LHx2FTVio35ZPvMQ0aG4';
    const FB_DB = 'https://diary-daniel-rinat-default-rtdb.firebaseio.com';
    const APP_PATH = 'deploy_panel';
    const INVITE_CODE = "#Deploy2026!";
    const WITH_BIO = true;
    const WITH_SMS = false;
    const SMS_COUNTRY = '+972';
    const SMS_EXPIRE_MIN = 5;
    const AUTH_KEY = 'armor_auth_token_' + APP_PATH;
    const PHONE_KEY = 'armor_phone_' + APP_PATH;
    
    // Check if already authenticated
    try{
      const saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');

    }catch(e){}

    function show(){

      let html = '<div id="__auth_box"><h2>🔒 כניסה מאובטחת</h2><div class="tab">' + tabs + '</div>' +
        '<div id="__tab_login"><input type="email" id="__em" placeholder="email" autocomplete="email"><input type="password" id="__pw" placeholder="סיסמה" autocomplete="current-password"><button type="button" id="__doLogin">כניסה</button>' +

        '</div>' +

        (WITH_SMS ? '<input type="tel" id="__phone2" placeholder="מספר טלפון (0501234567)">' : '') +
        (INVITE_CODE ? '<input type="text" id="__inv" placeholder="קוד הזמנה">' : '') +
        '<button type="button" id="__doSignup">הירשם</button></div>' +
        '<div id="__tab_reset" style="display:none"><input type="email" id="__em3" placeholder="email"><button type="button" id="__doReset">שלח קישור איפוס</button></div>' +
        (WITH_SMS ? '<div id="__sms_wrap"><div id="__sms_info">📱 שולח SMS...</div><div id="__recaptcha"></div><input type="text" id="__sms_code" placeholder="קוד SMS (6 ספרות)" inputmode="numeric" maxlength="6"><button type="button" id="__verifySms">אמת קוד</button><button type="button" id="__resendSms" style="background:linear-gradient(135deg,#6b7280,#4b5563);margin-top:4px">📲 שלח SMS מחדש</button></div>' : '') +
        '<div id="__auth_err"></div><div id="__auth_ok"></div></div>';
      ov.innerHTML = html;
      document.body.appendChild(ov);
      document.documentElement.style.visibility = '';
      
      function showTab(name){
        ['login','signup','reset'].forEach(t => {
          document.getElementById('__tab_' + t).style.display = t === name ? '' : 'none';
        });
        document.querySelectorAll('#__auth_overlay .tab button').forEach(b => {
          b.classList.toggle('active', b.dataset.t === name);
        });
        if(WITH_SMS) document.getElementById('__sms_wrap').classList.remove('show');
      }
      document.querySelectorAll('#__auth_overlay .tab button').forEach(b => {
        b.onclick = () => showTab(b.dataset.t);
      });
      
      const errEl = document.getElementById('__auth_err');
      const okEl = document.getElementById('__auth_ok');
      const setErr = m => {errEl.textContent = m; okEl.textContent='';};
      const setOk = m => {okEl.textContent = m; errEl.textContent='';};
      
      function normalizePhone(phone){
        phone = phone.replace(/[\s\-\(\)]/g, '');
        if(phone.startsWith('+')) return phone;
        if(phone.startsWith('0')) return SMS_COUNTRY + phone.substring(1);
        return SMS_COUNTRY + phone;
      }
      
      async function sendSMS(phone){
        if(!window.grecaptcha){
          throw new Error('reCAPTCHA לא נטען. רענן את העמוד.');
        }
        return new Promise((resolve, reject) => {
          try{
            // Render invisible recaptcha
            if(recaptchaWidget === null){
              recaptchaWidget = grecaptcha.render('__recaptcha', {
                sitekey: '6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI', // Firebase public test key
                size: 'invisible',
                callback: async (token) => {
                  try{
                    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendVerificationCode?key=' + FB_API, {
                      method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify({phoneNumber: phone, recaptchaToken: token})
                    });
                    const d = await r.json();
                    if(!r.ok) throw new Error(d.error?.message || 'SMS failed');
                    resolve(d.sessionInfo);
                  }catch(e){reject(e);}
                }
              });
            }
            grecaptcha.execute(recaptchaWidget);
          }catch(e){reject(e);}
        });
      }
      
      async function verifySMS(sessionInfo, code, idToken){
        const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPhoneNumber?key=' + FB_API, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({sessionInfo, code, idToken})
        });
        const d = await r.json();
        if(!r.ok) throw new Error(d.error?.message || 'קוד SMS שגוי');
        return d;
      }
      
      async function getUserPhone(idToken){
        try{
          // Fetch user's stored phone from Firebase RTDB
          const r = await fetch(FB_DB + '/' + APP_PATH + '/phones.json?auth=' + encodeURIComponent(idToken));
          if(!r.ok) return null;
          return await r.json();
        }catch(e){return null;}
      }
      
      async function completeLogin(email, uid, idToken, refreshToken, expiresIn){
        localStorage.setItem(AUTH_KEY, JSON.stringify({token: idToken, refresh: refreshToken, email, uid, exp: Date.now() + parseInt(expiresIn)*1000}));
        if(window.__rateLimit) window.__rateLimit.success();
        if(window.__audit) window.__audit('login_success', email);
        ov.remove();
        setTimeout(() => location.reload(), 100);
      }
      
      async function doLogin(email, pw){
        if(window.__rateLimit){try{window.__rateLimit.check();}catch(e){setErr(e.message); return;}}
        try{
          const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + FB_API, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({email, password: pw, returnSecureToken: true})
          });
          const d = await r.json();
          if(!r.ok) throw new Error(d.error?.message || 'שגיאה');
          
          if(WITH_SMS){
            // Get user's phone from DB
            const phones = await getUserPhone(d.idToken);
            const userPhone = phones && phones[d.localId] ? phones[d.localId] : null;
            if(!userPhone){
              // User registered before SMS was required - log them in but warn
              setErr('⚠️ אין מספר טלפון רשום. התחברות ללא 2FA (פעם אחת)');
              setTimeout(() => completeLogin(d.email, d.localId, d.idToken, d.refreshToken, d.expiresIn), 1500);
              return;
            }
            
            // SMS step required
            pendingLogin = {email: d.email, uid: d.localId, idToken: d.idToken, refreshToken: d.refreshToken, expiresIn: d.expiresIn, phone: userPhone};
            setOk('✅ הסיסמה נכונה, שולח SMS...');
            try{
              smsSessionInfo = await sendSMS(userPhone);
              document.getElementById('__sms_wrap').classList.add('show');
              document.getElementById('__sms_info').textContent = '📱 נשלח SMS ל-' + userPhone.replace(/(.{4})(.+)(.{4})/,'$1****$3');
              setOk('');
            }catch(e){setErr('❌ שליחת SMS נכשלה: ' + e.message);}
            return;
          }
          
          if(window.__encLS){try{await window.__encLS.init(pw);}catch(e){}}
          await completeLogin(d.email, d.localId, d.idToken, d.refreshToken, d.expiresIn);
        }catch(e){
          if(window.__rateLimit) window.__rateLimit.fail();
          if(window.__audit) window.__audit('login_fail', email);
          setErr('❌ ' + e.message);
        }
      }
      
      document.getElementById('__doLogin').onclick = () => {
        const em = document.getElementById('__em').value.trim();
        const pw = document.getElementById('__pw').value;
        if(!em || !pw){setErr('מלא הכל'); return;}
        doLogin(em, pw);
      };
      
      if(WITH_SMS){
        document.getElementById('__verifySms').onclick = async () => {
          const code = document.getElementById('__sms_code').value.trim();
          if(!code || code.length !== 6){setErr('❌ קוד SMS: 6 ספרות'); return;}
          if(!smsSessionInfo || !pendingLogin){setErr('❌ שגיאה: אין sessionInfo. נסה להיכנס שוב'); return;}

  <!-- Rate Limit -->
  <script>
  window.__rateLimit = {
    _key: 'rl_' + location.pathname,
    _max: 5,
    _window: 3600000,
    check(){
      const d = this._load();
      if(d.blockedUntil && Date.now() < d.blockedUntil){
        const m = Math.ceil((d.blockedUntil - Date.now())/60000);
        throw new Error('חסום למשך ' + m + ' דקות');
      }
      return true;
    },
    fail(){const d=this._load(); d.fails=(d.fails||0)+1; if(d.fails>=this._max){d.blockedUntil=Date.now()+this._window; d.fails=0;} this._save(d); return this._max-d.fails;},
    success(){this._save({fails:0, blockedUntil:0});},
    _load(){try{return JSON.parse(localStorage.getItem(this._key)||'{"fails":0}');}catch(e){return {fails:0};}},
    _save(d){try{localStorage.setItem(this._key, JSON.stringify(d));}catch(e){}}
  };

  <!-- Device Fingerprint -->
  <script>
  window.__fingerprint = async function(){
    const data = navigator.userAgent + '|' + navigator.language + '|' + screen.width + 'x' + screen.height + '|' + (navigator.hardwareConcurrency||'') + '|' + new Date().getTimezoneOffset();
    const buf = new TextEncoder().encode(data);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0,16);
  };

  <!-- Encrypted localStorage -->
  <script>
  window.__encLS = (function(){
    let _key = null;
    async function deriveKey(pw){
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2', salt: enc.encode('armor-salt-v1'), iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    }
    return {
      init: async function(pw){_key = await deriveKey(pw);},
      set: async function(k, v){
        if(!_key) throw new Error('Not initialized');
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _key, new TextEncoder().encode(v));
        const combined = new Uint8Array(iv.length + ct.byteLength);
        combined.set(iv);
        combined.set(new Uint8Array(ct), iv.length);
        localStorage.setItem(k, btoa(String.fromCharCode(...combined)));
      },
      get: async function(k){
        if(!_key) throw new Error('Not initialized');
        const stored = localStorage.getItem(k);
        if(!stored) return null;
        const data = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
        const iv = data.slice(0, 12);
        const ct = data.slice(12);
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, _key, ct);
        return new TextDecoder().decode(pt);
      }
    };
  })();
  </script>

  <!-- Rate Limit -->
  <script>
  window.__rateLimit = {
    _key: 'rl_' + location.pathname,
    _max: 5,
    _window: 3600000,
    check(){
      const d = this._load();
      if(d.blockedUntil && Date.now() < d.blockedUntil){
        const m = Math.ceil((d.blockedUntil - Date.now())/60000);
        throw new Error('חסום למשך ' + m + ' דקות');
      }
      return true;
    },
    fail(){const d=this._load(); d.fails=(d.fails||0)+1; if(d.fails>=this._max){d.blockedUntil=Date.now()+this._window; d.fails=0;} this._save(d); return this._max-d.fails;},
    success(){this._save({fails:0, blockedUntil:0});},
    _load(){try{return JSON.parse(localStorage.getItem(this._key)||'{"fails":0}');}catch(e){return {fails:0};}},
    _save(d){try{localStorage.setItem(this._key, JSON.stringify(d));}catch(e){}}
  };
  </script>
  <!-- Audit Log -->
  <script>
  (function(){
    const KEY = 'audit_' + location.pathname;
    window.__audit = function(ev, data){
      try{
        const log = JSON.parse(localStorage.getItem(KEY)||'[]');
        log.push({t: Date.now(), e: ev, d: data||null});
        while(log.length > 500) log.shift();
        localStorage.setItem(KEY, JSON.stringify(log));
      }catch(e){}
    };
    window.__audit('page_loaded');
  })();

  <!-- Device Fingerprint -->
  <script>
  window.__fingerprint = async function(){
    const data = navigator.userAgent + '|' + navigator.language + '|' + screen.width + 'x' + screen.height + '|' + (navigator.hardwareConcurrency||'') + '|' + new Date().getTimezoneOffset();
    const buf = new TextEncoder().encode(data);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('').substring(0,16);
  };
  </script>
  <!-- Encrypted localStorage -->
  <script>
  window.__encLS = (function(){
    let _key = null;
    async function deriveKey(pw){
      const enc = new TextEncoder();
      const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({name:'PBKDF2', salt: enc.encode('armor-salt-v1'), iterations:100000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    }
    return {
      init: async function(pw){_key = await deriveKey(pw);},
      set: async function(k, v){
        if(!_key) throw new Error('Not initialized');
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _key, new TextEncoder().encode(v));
        const combined = new Uint8Array(iv.length + ct.byteLength);
        combined.set(iv);
        combined.set(new Uint8Array(ct), iv.length);
        localStorage.setItem(k, btoa(String.fromCharCode(...combined)));
      },
      get: async function(k){
        if(!_key) throw new Error('Not initialized');
        const stored = localStorage.getItem(k);
        if(!stored) return null;
        const data = Uint8Array.from(atob(stored), c => c.charCodeAt(0));
        const iv = data.slice(0, 12);
        const ct = data.slice(12);
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, _key, ct);
        return new TextDecoder().decode(pt);
      }
    };
  })();
  </script>

        const bioBtn = document.getElementById('__auth_bio');
        const bioData = localStorage.getItem('armor_bio_' + APP_PATH);
        if(!bioData) bioBtn.style.display = 'none';
        else bioBtn.onclick = async () => {
          try{
            const info = JSON.parse(bioData);
            const chal = crypto.getRandomValues(new Uint8Array(32));
            const cred = await navigator.credentials.get({
              publicKey: {
                challenge: chal,
                allowCredentials: [{id: Uint8Array.from(atob(info.id), c => c.charCodeAt(0)), type:'public-key'}],
                timeout: 60000,
                userVerification: 'required'
              }
            });
            if(cred) await doLogin(info.email, info.pw);
          }catch(e){setErr('❌ ביומטרי נכשל: ' + e.message);}
        };
      }
    }
    
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', show);
    }else{show();}
  })();
  </script></head>
<body>

<h1>🚀 לוח פרסום</h1>
<p class="sub">עדכן כל אתר בלחיצה אחת</p>

<div class="token-row">
  <input class="token-inp" id="gh-token" type="password" placeholder="GitHub Token שלך..." dir="ltr">
  <button class="token-btn" onclick="saveToken()">💾 שמור</button>
</div>
<div class="token-status" id="token-status"></div>

<div class="sites-grid" id="sites-grid"></div>

<button class="add-btn" onclick="toggleAddForm()">✨ הוסף אתר חדש — הכל אוטומטי</button>

<div class="add-form" id="add-form">
  <div style="font-size:12px;color:#5eead4;margin-bottom:12px;text-align:center">ריפו נוצר + Pages מופעל אוטומטית 🎉</div>
  <input class="add-inp" id="new-name" placeholder="שם האתר (למשל: אתר רינת)">
  <input class="add-inp" id="new-repo" placeholder="שם ריפו (למשל: rinat-site)" dir="ltr">
  <input class="add-inp" id="new-owner" placeholder="שם משתמש גיטהאב" dir="ltr" value="pinto1212121212-create">
  <input type="file" accept=".html" id="new-file" style="display:none" onchange="document.getElementById('new-file-lbl').textContent=this.files[0]?'📄 '+this.files[0].name:''">
  <button class="deploy-btn" onclick="document.getElementById('new-file').click()" style="margin-bottom:4px">📁 בחר קובץ HTML</button>
  <div class="file-lbl" id="new-file-lbl"></div>
  <div class="prog" id="new-prog"><div class="prog-bar" id="new-progbar" style="width:0%"></div></div>
  <div class="new-step" id="new-step"></div>
  <div class="add-btns">
    <button class="btn-gray" onclick="toggleAddForm()">ביטול</button>
    <button class="btn-purple" id="btn-create" onclick="createAndDeploy()">🚀 צור ופרסם!</button>
  </div>
</div>

<div class="edit-overlay hidden" id="edit-overlay">
  <div class="edit-top">
    <div class="edit-title" id="edit-title">✏️ עריכה</div>
    <button class="edit-cancel" onclick="closeEditor()" style="padding:7px 14px;font-size:13px">✕ סגור</button>
  </div>
  <textarea class="edit-textarea" id="edit-textarea" spellcheck="false"></textarea>
  <div class="edit-status" id="edit-status"></div>
  <div class="edit-btns">
    <button class="edit-cancel" onclick="closeEditor()">ביטול</button>
    <button class="edit-cancel" onclick="downloadEdit()" style="background:#1e3a5f;color:#7dd3fc;border:1px solid #334155">⬇️ הורד</button>
    <button class="edit-save" id="edit-save-btn" onclick="saveEdit()">💾 שמור ופרסם</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div id="del-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#1e293b;border-radius:16px;padding:24px;margin:20px;border:1px solid #f87171;text-align:center">
    <div style="font-size:32px;margin-bottom:8px">🗑</div>
    <div id="del-modal-name" style="font-size:16px;font-weight:700;margin-bottom:6px"></div>
    <div style="font-size:13px;color:#94a3b8;margin-bottom:20px">למחוק מהרשימה?</div>
    <div style="display:flex;gap:10px">
      <button onclick="closeDelModal()" style="flex:1;background:#334155;border:none;border-radius:10px;padding:12px;color:white;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit">ביטול</button>
      <button onclick="doDelete()" style="flex:1;background:#dc2626;border:none;border-radius:10px;padding:12px;color:white;font-weight:700;cursor:pointer;font-size:14px;font-family:inherit">מחק</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_SITES=[
  {id:'panel',    name:'🚀 לוח פרסום',                 repo:'deploy-panel',   owner:'pinto1212121212-create'},
  {id:'hodaya',   name:'💙 היומן שלי — הודיה',         repo:'therapy-hodaya', owner:'pinto1212121212-create'},
  {id:'rinat',    name:'📖 היומן שלנו — רינת ודניאל',  repo:'diary-rinat',    owner:'pinto1212121212-create'},
  {id:'laser',    name:'💎 RB Pro Laser',               repo:'rb-prolaser',    owner:'pinto1212121212-create'},
  {id:'laregesh', name:'🌸 בית לרגש',                  repo:'beit-laregesh',  owner:'pinto1212121212-create'},
];

function getDeletedIds(){
  try{return JSON.parse(localStorage.getItem('deleted_ids')||'[]');}catch(e){return [];}
}
function getSites(){
  try{
    const s=localStorage.getItem('deploy_sites');
    const deleted=getDeletedIds();
    if(s===null){
      // פעם ראשונה — שומר DEFAULT בלי המחוקים
      const initial=DEFAULT_SITES.filter(x=>!deleted.includes(x.id));
      localStorage.setItem('deploy_sites',JSON.stringify(initial));
      return initial;
    }
    return (JSON.parse(s)||[]).filter(x=>!deleted.includes(x.id));
  }catch(e){return DEFAULT_SITES;}
}
function saveSites(s){localStorage.setItem('deploy_sites',JSON.stringify(s));}
function getToken(){return localStorage.getItem('gh_deploy_token')||'';}

let _toastTimer;
function toast(msg,isErr=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(isErr?' err':'')+' show';
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),3200);
}

function saveToken(){
  const t=document.getElementById('gh-token').value.trim();
  if(!t)return;
  localStorage.setItem('gh_deploy_token',t);
  document.getElementById('gh-token').value='';
  showTokenStatus();toast('✅ Token נשמר!');
}
function clearToken(){
  localStorage.removeItem('gh_deploy_token');showTokenStatus();toast('🗑 Token נמחק');
}
function showTokenStatus(){
  const el=document.getElementById('token-status');
  el.innerHTML=getToken()
    ?'<span style="color:#4ade80">✅ Token מחובר</span> &nbsp;·&nbsp; <span style="color:#475569;cursor:pointer;text-decoration:underline" onclick="clearToken()">נקה</span>'
    :'<span style="color:#f87171">⚠️ Token לא הוגדר</span>';
}

function renderSites(){
  document.getElementById('sites-grid').innerHTML=getSites().map(s=>{
    const url=`https://${s.owner}.github.io/${s.repo}`;
    const isSelf=(s.repo==='deploy-panel');
    return`<div class="site-card">
      <div class="site-card-top">
        <div>
          <div class="site-name">${s.name}</div>
          <div class="site-repo">${s.owner}/${s.repo}</div>
          <a class="site-link" href="${url}" target="_blank">🌐 פתח אתר</a>
        </div>
        <div class="card-actions">
          <button class="edit-btn" onclick="moveSite('${s.id}',-1)" style="padding:6px 8px">▲</button>
          <button class="edit-btn" onclick="moveSite('${s.id}',1)" style="padding:6px 8px">▼</button>
          <button class="copy-btn" id="copy-${s.id}" onclick="copyLink('${s.id}','${url}')">🔗</button>
          <button class="edit-btn" onclick="openEditor('${s.repo}','${s.owner}','${s.name}')">✏️</button>
          <button class="del-btn" onclick="confirmDelete('${s.id}','${s.name}')">🗑</button>
        </div>
      </div>
      <input type="file" accept=".html" id="file-${s.id}" style="display:none" onchange="doUpload('${s.id}','${s.repo}','${s.owner}',this)">
      <button class="deploy-btn" id="btn-${s.id}" onclick="document.getElementById('file-${s.id}').click()">🚀 בחר קובץ ופרסם</button>
      ${isSelf?`<button class="self-btn" id="self-btn-${s.id}" onclick="deploySelf('${s.id}','${s.repo}','${s.owner}')">♻️ עדכן את הצינור עצמו (מהיר)</button>`:''}
      <div class="prog" id="prog-${s.id}"><div class="prog-bar" id="progbar-${s.id}" style="width:0%"></div></div>
      <div class="card-status" id="status-${s.id}"></div>
    </div>`;
  }).join('');
}

// העלאה עצמית — לוקחת את ה-HTML של הדף הנוכחי ומעלה לגיטהאב
async function deploySelf(id,repo,owner){
  const token=getToken();if(!token){toast('⚠️ נא להכניס Token קודם',true);return;}
  const btn=document.getElementById('self-btn-'+id),st=document.getElementById('status-'+id);
  const prog=document.getElementById('prog-'+id),pb=document.getElementById('progbar-'+id);
  if(!confirm('♻️ לעדכן את הצינור עצמו לגיטהאב?\n\nהגרסה שרצה עכשיו בדפדפן תעלה ותחליף את זו שבגיטהאב.'))return;
  btn.disabled=true;btn.textContent='⏳ מעלה...';prog.style.display='block';pb.style.width='20%';
  st.textContent='אוסף HTML נוכחי...';st.className='card-status';
  try{
    // שליפת ה-HTML המלא של הדף הנוכחי
    const content='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const encoded=btoa(unescape(encodeURIComponent(content)));
    pb.style.width='50%';st.textContent='מעלה לגיטהאב...';
    const apiUrl=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
    const chk=await (await fetch(apiUrl+`?t=${Date.now()}`,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Cache-Control':'no-cache'}})).json();
    const body={message:'Self-update via deploy panel',content:encoded};if(chk.sha)body.sha=chk.sha;
    pb.style.width='80%';
    const d=await (await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(!d.content)throw new Error(d.message||'שגיאה בהעלאה');
    pb.style.width='100%';
    btn.textContent='✅ עלה! מרענן...';btn.style.background='#059669';
    st.innerHTML=`✅ <a href="https://${owner}.github.io/${repo}" target="_blank" style="color:#5eead4;text-decoration:underline;font-weight:700">פתח אתר עכשיו ←</a>`;
    toast('✅ הצינור עודכן בהצלחה!');
    setTimeout(()=>location.reload(),4000);
  }catch(e){
    btn.textContent='❌ שגיאה';btn.disabled=false;st.textContent=e.message;st.className='card-status err';
    toast('❌ '+e.message,true);
    setTimeout(()=>{btn.textContent='♻️ עדכן את הצינור עצמו (מהיר)';prog.style.display='none';pb.style.width='0%';},3000);
  }
}

async function enablePages(owner,repo,token){
  try{await fetch(`https://api.github.com/repos/${owner}/${repo}/pages`,{method:'POST',
    headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({source:{branch:'main',path:'/'}})});}catch(e){}
}

async function doUpload(id,repo,owner,input){
  const file=input.files[0];if(!file)return;
  const token=getToken();if(!token){toast('⚠️ נא להכניס Token קודם',true);return;}
  const btn=document.getElementById('btn-'+id),st=document.getElementById('status-'+id);
  const prog=document.getElementById('prog-'+id),pb=document.getElementById('progbar-'+id);
  btn.disabled=true;btn.textContent='⏳ מעלה...';prog.style.display='block';pb.style.width='20%';
  st.textContent='קורא קובץ...';st.className='card-status';
  try{
    const content=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file);});
    const encoded=btoa(unescape(encodeURIComponent(content)));
    pb.style.width='50%';st.textContent='מעלה לגיטהאב...';
    const apiUrl=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
    const chk=await (await fetch(apiUrl,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})).json();
    const body={message:'Update via deploy panel',content:encoded};if(chk.sha)body.sha=chk.sha;
    pb.style.width='75%';
    const d=await (await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(!d.content)throw new Error(d.message||'שגיאה בהעלאה');
    pb.style.width='90%';st.textContent='מפעיל Pages...';
    await enablePages(owner,repo,token);
    pb.style.width='100%';
    btn.textContent='✅ עלה!';btn.style.background='#059669';
    st.innerHTML=`✅ <a href="https://${owner}.github.io/${repo}" target="_blank" style="color:#5eead4;text-decoration:underline;font-weight:700">פתח אתר עכשיו ←</a>`;
    toast('✅ '+repo+' עלה בהצלחה!');
    // אם עדכנו את הצינור עצמו — נרענן אחרי 4 שניות
    if(repo==='deploy-panel'){
      st.textContent='מרענן...';
      setTimeout(()=>location.reload(),4000);
      return;
    }
    setTimeout(()=>{btn.textContent='🚀 בחר קובץ ופרסם';btn.disabled=false;btn.style.background='';st.textContent='';st.innerHTML='';prog.style.display='none';pb.style.width='0%';input.value='';},10000);
  }catch(e){
    btn.textContent='❌ שגיאה';btn.disabled=false;st.textContent=e.message;st.className='card-status err';
    toast('❌ '+e.message,true);
    setTimeout(()=>{btn.textContent='🚀 בחר קובץ ופרסם';prog.style.display='none';pb.style.width='0%';},3000);
  }
}

async function createAndDeploy(){
  const name=document.getElementById('new-name').value.trim();
  const repo=document.getElementById('new-repo').value.trim();
  const owner=document.getElementById('new-owner').value.trim();
  const file=document.getElementById('new-file').files[0];
  const token=getToken();
  if(!name||!repo){toast('⚠️ נא למלא שם ושם ריפו',true);return;}
  if(!file){toast('⚠️ נא לבחור קובץ HTML',true);return;}
  if(!token){toast('⚠️ נא להכניס Token קודם',true);return;}
  const btn=document.getElementById('btn-create');
  const prog=document.getElementById('new-prog'),pb=document.getElementById('new-progbar'),step=document.getElementById('new-step');
  btn.disabled=true;prog.style.display='block';
  try{
    step.textContent='📄 קורא קובץ...';pb.style.width='10%';
    const content=await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file);});
    const encoded=btoa(unescape(encodeURIComponent(content)));
    step.textContent='🏗️ יוצר ריפו...';pb.style.width='25%';
    const cr=await (await fetch('https://api.github.com/user/repos',{method:'POST',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({name:repo,private:false,auto_init:false})})).json();
    const exists=cr.message?.toLowerCase().includes('already exist');
    if(cr.errors&&!exists)throw new Error(cr.message);
    if(!exists)await new Promise(r=>setTimeout(r,1500));
    step.textContent='⬆️ מעלה קובץ...';pb.style.width='55%';
    const apiUrl=`https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
    const chk=await (await fetch(apiUrl,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})).json();
    const body={message:'Initial deploy',content:encoded};if(chk.sha)body.sha=chk.sha;
    const up=await (await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)})).json();
    if(!up.content)throw new Error(up.message||'שגיאה בהעלאה');
    step.textContent='🌐 מפעיל Pages...';pb.style.width='85%';
    await enablePages(owner,repo,token);
    pb.style.width='100%';step.textContent='';
    const sites=getSites();sites.push({id:'site_'+Date.now(),name,repo,owner});saveSites(sites);
    ['new-name','new-repo'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('new-file-lbl').textContent='';document.getElementById('new-file').value='';
    document.getElementById('add-form').classList.remove('show');
    btn.disabled=false;prog.style.display='none';pb.style.width='0%';
    renderSites();toast('✅ '+repo+' נוצר! יהיה זמין תוך דקה');
  }catch(e){
    step.textContent='❌ '+e.message;btn.disabled=false;toast('❌ '+e.message,true);
    setTimeout(()=>{step.textContent='';prog.style.display='none';pb.style.width='0%';},4000);
  }
}

function toggleAddForm(){document.getElementById('add-form').classList.toggle('show');}

// העתקת קישור של אתר ללוח — עם fallback לדפדפנים ישנים
async function copyLink(id,url){
  const btn=document.getElementById('copy-'+id);
  const original=btn.textContent;
  try{
    // שיטה מודרנית — navigator.clipboard (דורש HTTPS)
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(url);
    }else{
      // fallback ידני — עובד בכל דפדפן
      const ta=document.createElement('textarea');
      ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';ta.style.top='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      if(!ok)throw new Error('fallback failed');
    }
    // משוב ויזואלי
    btn.textContent='✅';btn.classList.add('done');
    toast('📋 הקישור הועתק!');
    setTimeout(()=>{btn.textContent=original;btn.classList.remove('done');},1500);
  }catch(e){
    toast('❌ לא הצלחתי להעתיק',true);
  }
}
function moveSite(id,dir){
  const sites=getSites();
  const i=sites.findIndex(s=>s.id===id);
  const j=i+dir;
  if(j<0||j>=sites.length)return;
  [sites[i],sites[j]]=[sites[j],sites[i]];
  saveSites(sites);renderSites();
}
let _delId='';
function confirmDelete(id,name){
  _delId=id;
  document.getElementById('del-modal-name').textContent=name;
  document.getElementById('del-modal').style.display='flex';
}
function closeDelModal(){document.getElementById('del-modal').style.display='none';_delId='';}
function doDelete(){
  if(!_delId)return;
  const deleted=getDeletedIds();
  if(!deleted.includes(_delId))deleted.push(_delId);
  localStorage.setItem('deleted_ids',JSON.stringify(deleted));
  saveSites(getSites().filter(s=>s.id!==_delId));
  closeDelModal();renderSites();
  toast('🗑 נמחק');
}
function downloadEdit(){
  const content=document.getElementById('edit-textarea').value;
  if(!content)return;
  const a=document.createElement('a');
  a.href='data:text/html;charset=utf-8,'+encodeURIComponent(content);
  a.download=(editCtx.repo||'site')+'.html';
  a.click();
}
let editCtx={repo:'',owner:'',sha:''};
async function openEditor(repo,owner,name){
  const token=getToken();if(!token){toast('⚠️ נא להכניס Token קודם',true);return;}
  document.getElementById('edit-title').textContent='✏️ '+name;
  document.getElementById('edit-textarea').value='';
  document.getElementById('edit-overlay').classList.remove('hidden');
  const st=document.getElementById('edit-status');st.textContent='⏳ טוען קובץ...';st.style.color='#5eead4';
  try{
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`,
      {headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    const d=await r.json();
    if(!d.content)throw new Error(d.message||'קובץ לא נמצא');
    editCtx={repo,owner,sha:d.sha};
    document.getElementById('edit-textarea').value=decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
    st.textContent='';
  }catch(e){st.textContent='❌ '+e.message;st.style.color='#f87171';}
}
function closeEditor(){
  document.getElementById('edit-overlay').classList.add('hidden');
  document.getElementById('edit-textarea').value='';
  document.getElementById('edit-status').textContent='';
  const btn=document.getElementById('edit-save-btn');
  btn.textContent='💾 שמור ופרסם';btn.disabled=false;btn.style.background='';
  editCtx={repo:'',owner:'',sha:''};
}
async function saveEdit(){
  const token=getToken();if(!token){toast('⚠️ אין Token',true);return;}
  const content=document.getElementById('edit-textarea').value;
  const st=document.getElementById('edit-status'),btn=document.getElementById('edit-save-btn');
  btn.disabled=true;btn.textContent='⏳ שומר...';st.textContent='מעלה...';st.style.color='#5eead4';
  try{
    const encoded=btoa(unescape(encodeURIComponent(content)));
    const body={message:'Edit via deploy panel',content:encoded,sha:editCtx.sha};
    const r=await fetch(`https://api.github.com/repos/${editCtx.owner}/${editCtx.repo}/contents/index.html`,
      {method:'PUT',headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.content)throw new Error(d.message||'שגיאה');
    st.textContent='✅ נשמר! מתעדכן תוך דקה';btn.textContent='✅ נשמר!';btn.style.background='#059669';
    toast('✅ '+editCtx.repo+' נשמר!');
    setTimeout(()=>closeEditor(),2500);
  }catch(e){
    st.textContent='❌ '+e.message;st.style.color='#f87171';
    btn.disabled=false;btn.textContent='💾 שמור ופרסם';btn.style.background='';
    toast('❌ '+e.message,true);
  }
}

window.onload=()=>{showTokenStatus();renderSites();};
</script>
